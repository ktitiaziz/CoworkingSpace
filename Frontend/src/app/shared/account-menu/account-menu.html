<div class="account-menu">
  @if (isLoggedIn) {
    <button type="button" class="account-trigger" aria-label="Account menu" [attr.aria-expanded]="open" (click)="toggle()">
      <span class="account-icon" aria-hidden="true">♙</span>
      <span>Account</span>
      <span aria-hidden="true">▾</span>
    </button>
    @if (open) {
      <div class="account-dropdown">
        <a routerLink="/my-reservations" (click)="open = false">My Reservations</a>
        <button type="button" (click)="logout()">Logout</button>
      </div>
    }
  } @else {
    <a class="login-btn" routerLink="/auth" [queryParams]="{ mode: 'login' }">Login</a>
  }
</div>
